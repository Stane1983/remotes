# *********************************************************************************************************
#
# 	this file is configuration for each factory remote device
#
# 	work_mode	  0 :software mode  1 :hardware mode
#	repeat_enable	  0 :disable repeat 1 :enable repeat
#
#	factory_code      each device has it's unique factory code.
#			  pattern:custom_code(16bit)+index_code(16bit)
#			  examble: 0xff000001 = 0xff00(custom cod)  0001 (index)
#
#	release_delay	  unit:ms.release will report from kernel to user layer after this period of time
#			  from press or repeat triggered.
#
#	debug_enable      0 :debug disable  1 :debug disable
#
# SW MODE:
#
#	bit_count	  how many bits in each frame
#	tw_leader_act	  time window for leader active
#	tw_bit0		  time window for bit0 time.
#	tw_bit1		  time window for bit1 time
#	tw_repeat_leader  time window for repeat leader
#
# REG
#
#	reg_base_gen	  set value for PREG_IR_DEC_BASE_GEN
#	reg_control	  set value for PREG_IR_DEC_CONTROL
#	reg_leader_act	  set value for PREG_IR_DEC_LEADER_ACTIVE
#	reg_leader_idle	  set value for PREG_IR_DEC_LEADER_IDLE
#	reg_repeat_leader set value for PREG_IR_DEC_REPEAT_IDLE
#	reg_bit0_time	  set value for PREG_IR_DEC_BIT0_TIME
#
# *********************************************************************************************************
#
# amlogic NEC remote * BuzzTV IR-100
#
	work_mode  	= 0
	repeat_enable 	= 1
	repeat_delay 	= 130
	repeat_peroid 	= 120
	release_delay   = 20
	debug_enable 	= 0

custom_begin
    factory_code = 0xbd020001
    fn_key_scancode = 0x50
    left_key_scancode = 0x99
    right_key_scancode = 0xc1
    up_key_scancode = 0xca
    down_key_scancode = 0xd2
    ok_key_scancode = 0xce
#
mouse_begin
    0 0x99
    1 0xc1
    2 0xca
    3 0xd2
mouse_end
#
key_begin
    0x45 116  #ON/OFF
    0xf3 217  #SEARCH
    0x80 113  #VOL MUTE
    0xf4 364  #FAVS
    0xda 168  #KEYCODE_MEDIA_REWIND
    0x62 164  #KEYCODE_MEDIA_PLAY_PAUSE
    0x84 159  #KEYCODE_MEDIA_FAST_FORWARD
    0xf5 167  #KEYCODE_MEDIA_RECORD
    0xd4 128  #KEYCODE_MEDIA_STOP
    0xd6 139  #MENU
    0xd0 174  #EXIT
    0xca 103  #UP
    0x99 105  #LEFT
    0xce 97   #DPAD_CENTER
    0xc1 106  #RIGHT
    0xd2 108  #DOWN
    0xd8 166  # F6 (Info)
    0x95 102  #HOME
    0xdd 115  #VOL+
    0x8c 114  #VOL-
    0x9a 402  # Channel up
    0xcd 403  # Channel down
    0x92 2    #1
    0x93 3    #2
    0xcc 4    #3
    0x8e 5    #4
    0x8f 6    #5
    0xc8 7    #6
    0x8a 8    #7
    0x8b 9    #8
    0xc4 10   #9
    0x87 11   #0
    0xd9 109  # Page down
    0x82 104  # Page up
    0x46 398  #KEYCODE_PROG_RED
    0x47 399  #KEYCODE_PROG_GREEN
    0x48 400  #KEYCODE_PROG_YELLOW
    0x49 401  #KEYCODE_PROG_BLUE
key_end
#
